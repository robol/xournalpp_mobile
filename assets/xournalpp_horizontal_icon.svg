<svg xmlns="http://www.w3.org/2000/svg" width="1904" height="476" viewBox="72 82 1904 476" role="img" aria-labelledby="title desc">
  <title id="title">Xournal++ Horizontal Logo</title>
  <desc id="desc">A horizontal light-blue Xournal++ logo with a notebook and stylus icon on the left and the Xournal++ wordmark on the right.</desc>
  <defs>
    <linearGradient id="bannerBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EAF8FF"/>
      <stop offset="0.58" stop-color="#D7F0FF"/>
      <stop offset="1" stop-color="#B8E4FF"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0288D1"/>
      <stop offset="1" stop-color="#29B6F6"/>
    </linearGradient>
    <linearGradient id="blueDark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#01579B"/>
      <stop offset="1" stop-color="#03A9F4"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F7FCFF"/>
    </linearGradient>
    <linearGradient id="penBody" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111A22"/>
      <stop offset="0.5" stop-color="#455A64"/>
      <stop offset="1" stop-color="#0B1117"/>
    </linearGradient>
    <filter id="bannerShadow" x="-8%" y="-25%" width="116%" height="155%">
      <feDropShadow dx="0" dy="20" stdDeviation="26" flood-color="#263238" flood-opacity="0.16"/>
    </filter>
    <filter id="cardShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#01579B" flood-opacity="0.24"/>
    </filter>
    <filter id="smallShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#01579B" flood-opacity="0.22"/>
    </filter>
  </defs>

  <g filter="url(#bannerShadow)">
    <rect x="72" y="82" width="1904" height="476" rx="0" ry="0" fill="url(#bannerBg)"/>
    <path d="M115 455 C330 380 478 512 695 435 C920 356 1100 398 1308 327 C1518 255 1734 272 1968 174 L1968 558 L115 558 Z" fill="#FFFFFF" opacity="0.33"/>
    <circle cx="1764" cy="184" r="180" fill="#FFFFFF" opacity="0.18"/>
    <circle cx="1570" cy="475" r="260" fill="#81D4FA" opacity="0.14"/>
  </g>

  <!-- notebook icon -->
  <g transform="translate(184 160)" filter="url(#cardShadow)">
    <path d="M86 18h274c38 0 69 31 69 69v230c0 38-31 69-69 69H86c-38 0-69-31-69-69V87c0-38 31-69 69-69z" fill="#B3E5FC" opacity="0.82" transform="translate(38 10)"/>
    <path d="M73 0h276c38 0 69 31 69 69v232c0 38-31 69-69 69H73c-38 0-69-31-69-69V69C4 31 35 0 73 0z" fill="url(#paper)"/>
    <path d="M73 0h70v370H73c-38 0-69-31-69-69V69C4 31 35 0 73 0z" fill="url(#blue)"/>
    <path d="M143 0h206c38 0 69 31 69 69v232c0 38-31 69-69 69H143z" fill="#FFFFFF" opacity="0.74"/>
    <g stroke="#B3E5FC" stroke-width="4" opacity="0.75">
      <path d="M176 64H378"/><path d="M176 110H378"/><path d="M176 156H378"/><path d="M176 202H378"/><path d="M176 248H378"/><path d="M176 294H378"/>
    </g>
    <g filter="url(#smallShadow)">
      <g fill="#FFFFFF">
        <rect x="-9" y="55" width="70" height="14" rx="7"/>
        <rect x="-9" y="111" width="70" height="14" rx="7"/>
        <rect x="-9" y="167" width="70" height="14" rx="7"/>
        <rect x="-9" y="223" width="70" height="14" rx="7"/>
      </g>
      <g fill="#01579B" opacity="0.55">
        <circle cx="61" cy="62" r="14"/><circle cx="61" cy="118" r="14"/><circle cx="61" cy="174" r="14"/><circle cx="61" cy="230" r="14"/>
      </g>
    </g>
    <g stroke="url(#blueDark)" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M202 114 C228 152 252 206 285 283" stroke-width="37"/>
      <path d="M319 95 C278 143 242 194 196 287" stroke-width="37"/>
      <path d="M348 171 L348 215" stroke-width="18"/>
      <path d="M326 193 L370 193" stroke-width="18"/>
      <path d="M406 171 L406 215" stroke-width="18"/>
      <path d="M384 193 L428 193" stroke-width="18"/>
    </g>
  </g>

  <!-- stylus -->
  <g transform="translate(574 175) rotate(29)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="52" height="328" rx="26" fill="url(#penBody)"/>
    <rect x="8" y="16" width="36" height="22" rx="10" fill="#81D4FA"/>
    <rect x="37" y="82" width="8" height="116" rx="4" fill="#90A4AE" opacity="0.8"/>
    <path d="M11 318h30l-15 42z" fill="#263238"/>
    <circle cx="26" cy="362" r="4" fill="#111820"/>
  </g>

  <!-- wordmark -->
  <g transform="translate(742 0)">
    <text x="0" y="389" font-family="Inter, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="212" font-weight="800" letter-spacing="-8" fill="#17283A">Xournal</text>
    <text x="910" y="389" font-family="Inter, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="212" font-weight="800" letter-spacing="-4" fill="#0288D1">++</text>
  </g>
</svg>
