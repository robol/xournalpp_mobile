name: Flutter Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to build, for example v1.2.3 or v1.2.3-beta.1"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.build-type }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - build-type: apk
            os: ubuntu-latest
          - build-type: aab
            os: ubuntu-latest
          - build-type: linux
            os: ubuntu-latest
          - build-type: debian
            os: ubuntu-latest
          - build-type: windows
            os: windows-latest
          - build-type: macos
            os: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            cmake \
            libgtk-3-dev \
            libsecret-1-dev \
            ninja-build \
            pkg-config

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve Flutter dependencies
        run: flutter pub get

      - name: Validate Google OAuth client IDs
        shell: bash
        env:
          DRIVE_WEB_CLIENT: ${{ vars.GOOGLE_WEB_CLIENT_ID || secrets.GOOGLE_WEB_CLIENT_ID }}
          DRIVE_IOS_CLIENT: ${{ vars.GOOGLE_IOS_CLIENT_ID || secrets.GOOGLE_IOS_CLIENT_ID }}
          DRIVE_MACOS_CLIENT: ${{ vars.GOOGLE_MACOS_CLIENT_ID || secrets.GOOGLE_MACOS_CLIENT_ID }}
          DRIVE_DESKTOP_CLIENT: ${{ vars.GOOGLE_DESKTOP_CLIENT_ID || secrets.GOOGLE_DESKTOP_CLIENT_ID }}
          DRIVE_DESKTOP_SECRET: ${{ secrets.GOOGLE_DESKTOP_CLIENT_SECRET }}
          BUILD_TYPE: ${{ matrix.build-type }}
        run: |
          for client in "$DRIVE_WEB_CLIENT" "$DRIVE_IOS_CLIENT" "$DRIVE_MACOS_CLIENT" "$DRIVE_DESKTOP_CLIENT"; do
            if [[ -n "$client" && ! "$client" =~ ^[A-Za-z0-9_-]+\.apps\.googleusercontent\.com$ ]]; then
              echo "A Google OAuth client ID has an invalid format." >&2
              exit 1
            fi
          done
          if [[ "$BUILD_TYPE" == linux || "$BUILD_TYPE" == debian || "$BUILD_TYPE" == windows ]]; then
            if [[ -z "$DRIVE_DESKTOP_CLIENT" || -z "$DRIVE_DESKTOP_SECRET" ]]; then
              echo "Set GOOGLE_DESKTOP_CLIENT_ID (variable or secret) and GOOGLE_DESKTOP_CLIENT_SECRET (secret) for desktop builds." >&2
              exit 1
            fi
          fi

      - name: Build and upload release artifact
        if: matrix.build-type != 'apk' && matrix.build-type != 'aab'
        uses: oberhauser-dev/flutter-release-action@v0
        with:
          token: ${{ secrets.FLUTTER_RELEASE_GITHUB_TOKEN }}
          app-name: 'xournalpp-mobile'
          dry-run: false
          app-version: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
          tag: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
          build-type: ${{ matrix.build-type }}
          build-args: |-
            --dart-define=GOOGLE_WEB_CLIENT_ID=${{ vars.GOOGLE_WEB_CLIENT_ID || secrets.GOOGLE_WEB_CLIENT_ID }}
            --dart-define=GOOGLE_IOS_CLIENT_ID=${{ vars.GOOGLE_IOS_CLIENT_ID || secrets.GOOGLE_IOS_CLIENT_ID }}
            --dart-define=GOOGLE_MACOS_CLIENT_ID=${{ vars.GOOGLE_MACOS_CLIENT_ID || secrets.GOOGLE_MACOS_CLIENT_ID }}
            --dart-define=GOOGLE_DESKTOP_CLIENT_ID=${{ vars.GOOGLE_DESKTOP_CLIENT_ID || secrets.GOOGLE_DESKTOP_CLIENT_ID }}
            --dart-define=GOOGLE_DESKTOP_CLIENT_SECRET=${{ secrets.GOOGLE_DESKTOP_CLIENT_SECRET }}

      - name: Build and upload signed APK release artifact
        if: matrix.build-type == 'apk'
        uses: oberhauser-dev/flutter-release-action@v0
        with:
          token: ${{ secrets.FLUTTER_RELEASE_GITHUB_TOKEN }}
          app-name: 'xournalpp-mobile'
          dry-run: false
          app-version: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
          tag: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
          build-type: ${{ matrix.build-type }}
          build-args: |-
            --dart-define=GOOGLE_WEB_CLIENT_ID=${{ vars.GOOGLE_WEB_CLIENT_ID || secrets.GOOGLE_WEB_CLIENT_ID }}
            --dart-define=GOOGLE_IOS_CLIENT_ID=${{ vars.GOOGLE_IOS_CLIENT_ID || secrets.GOOGLE_IOS_CLIENT_ID }}
            --dart-define=GOOGLE_MACOS_CLIENT_ID=${{ vars.GOOGLE_MACOS_CLIENT_ID || secrets.GOOGLE_MACOS_CLIENT_ID }}
          android-keystore-file-base64: ${{ secrets.ANDROID_KEYSTORE }}
          android-keystore-password: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          android-key-alias: ${{ secrets.ANDROID_KEY_ALIAS }}
          android-key-password: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Build, release, and publish AAB to Google Play internal testing
        if: matrix.build-type == 'aab'
        uses: oberhauser-dev/flutter-release-action@v0
        with:
          token: ${{ secrets.FLUTTER_RELEASE_GITHUB_TOKEN }}
          app-name: 'xournalpp-mobile'
          dry-run: false
          app-version: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
          tag: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
          build-type: ${{ matrix.build-type }}
          build-args: |-
            --dart-define=GOOGLE_WEB_CLIENT_ID=${{ vars.GOOGLE_WEB_CLIENT_ID || secrets.GOOGLE_WEB_CLIENT_ID }}
            --dart-define=GOOGLE_IOS_CLIENT_ID=${{ vars.GOOGLE_IOS_CLIENT_ID || secrets.GOOGLE_IOS_CLIENT_ID }}
            --dart-define=GOOGLE_MACOS_CLIENT_ID=${{ vars.GOOGLE_MACOS_CLIENT_ID || secrets.GOOGLE_MACOS_CLIENT_ID }}
          publish-stage: 'internal'
          publish-distributor: 'android-google-play'
          publish-android-fastlane-secrets-json-base64: ${{ secrets.ANDROID_GOOGLE_PLAY_JSON }}
          publish-android-release-status: 'completed'
          android-keystore-file-base64: ${{ secrets.ANDROID_KEYSTORE }}
          android-keystore-password: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          android-key-alias: ${{ secrets.ANDROID_KEY_ALIAS }}
          android-key-password: ${{ secrets.ANDROID_KEY_PASSWORD }}
