name: Flutter Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to build, for example v1.2.3"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.build-type }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - build-type: apk
            os: ubuntu-latest
          - build-type: aab
            os: ubuntu-latest
          - build-type: web
            os: ubuntu-latest
          - build-type: linux
            os: ubuntu-latest
          - build-type: debian
            os: ubuntu-latest
          - build-type: windows
            os: windows-latest
          - build-type: macos
            os: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            cmake \
            libgtk-3-dev \
            ninja-build \
            pkg-config

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve Flutter dependencies
        run: flutter pub get

      - name: Build and upload release artifact
        uses: oberhauser-dev/flutter-release-action@v0
        with:
          token: ${{ secrets.FLUTTER_RELEASE_GITHUB_TOKEN }}
          app-version: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
          tag: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
          build-type: ${{ matrix.build-type }}
